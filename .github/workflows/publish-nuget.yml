name: Publish NuGet package

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package Avalonia
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: List .NET SDKs
        run: dotnet --info

      - name: Download FFmpeg runtimes
        shell: pwsh
        run: |
          ./Support/download-ffmpeg.ps1 `
            -Rids @('win-x64', 'win-arm64', 'linux-x64')

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          else {
            $version = "0.1.0-ci.${{ github.run_number }}"
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Unable to determine the package version.'
          }

          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: |
          $projects = @(
            'Unosquare.FFME.Avalonia/Unosquare.FFME.Avalonia.csproj'
            'FFMediaElement.Avalonia.FFmpeg.win-x64/FFMediaElement.Avalonia.FFmpeg.win-x64.csproj'
            'FFMediaElement.Avalonia.FFmpeg.win-arm64/FFMediaElement.Avalonia.FFmpeg.win-arm64.csproj'
            'FFMediaElement.Avalonia.FFmpeg.linux-x64/FFMediaElement.Avalonia.FFmpeg.linux-x64.csproj'
          )

          foreach ($project in $projects) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
            'Unosquare.FFME.Avalonia/Unosquare.FFME.Avalonia.csproj'
            'FFMediaElement.Avalonia.FFmpeg.win-x64/FFMediaElement.Avalonia.FFmpeg.win-x64.csproj'
            'FFMediaElement.Avalonia.FFmpeg.win-arm64/FFMediaElement.Avalonia.FFmpeg.win-arm64.csproj'
            'FFMediaElement.Avalonia.FFmpeg.linux-x64/FFMediaElement.Avalonia.FFmpeg.linux-x64.csproj'
          )

          foreach ($project in $projects) {
            dotnet build $project `
              --configuration Release `
              --no-restore `
              -p:Version='${{ steps.version.outputs.value }}' `
              -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Pack
        shell: pwsh
        run: |
          $projects = @(
            'Unosquare.FFME.Avalonia/Unosquare.FFME.Avalonia.csproj'
            'FFMediaElement.Avalonia.FFmpeg.win-x64/FFMediaElement.Avalonia.FFmpeg.win-x64.csproj'
            'FFMediaElement.Avalonia.FFmpeg.win-arm64/FFMediaElement.Avalonia.FFmpeg.win-arm64.csproj'
            'FFMediaElement.Avalonia.FFmpeg.linux-x64/FFMediaElement.Avalonia.FFmpeg.linux-x64.csproj'
          )

          foreach ($project in $projects) {
            dotnet pack $project `
              --configuration Release `
              --no-build `
              --no-restore `
              --output Publish `
              -p:PackageVersion='${{ steps.version.outputs.value }}' `
              -p:RepositoryBranch='${{ github.ref_name }}' `
              -p:RepositoryCommit='${{ github.sha }}' `
              -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: FFMediaElement.Avalonia-${{ github.sha }}
          path: Publish/*
          if-no-files-found: error

      - name: Log in to NuGet with OIDC
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: lijiaolong

      - name: Publish packages to NuGet
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $packageIds = @(
            'FFMediaElement.Avalonia'
            'FFMediaElement.Avalonia.FFmpeg.win-x64'
            'FFMediaElement.Avalonia.FFmpeg.win-arm64'
            'FFMediaElement.Avalonia.FFmpeg.linux-x64'
          )
          $packages = @(Get-ChildItem 'Publish/*.nupkg' -File)
          if ($packages.Count -ne $packageIds.Count) {
            throw "Expected $($packageIds.Count) packages, but found $($packages.Count)."
          }

          foreach ($packageId in $packageIds) {
            $packagePath = "Publish/$packageId.${{ steps.version.outputs.value }}.nupkg"
            if (-not (Test-Path $packagePath)) {
              throw "Expected package was not created: $packagePath"
            }

            dotnet nuget push $packagePath `
              --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' `
              --source 'https://api.nuget.org/v3/index.json' `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
