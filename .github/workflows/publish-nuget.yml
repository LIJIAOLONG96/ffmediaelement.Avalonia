name: Publish NuGet package

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package Avalonia
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: List .NET SDKs
        run: dotnet --info

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          else {
            $version = "0.1.0-ci.${{ github.run_number }}"
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Unable to determine the package version.'
          }

          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Unosquare.FFME.Avalonia/Unosquare.FFME.Avalonia.csproj

      - name: Build
        shell: pwsh
        run: |
          dotnet build Unosquare.FFME.Avalonia/Unosquare.FFME.Avalonia.csproj `
            --configuration Release `
            --no-restore `
            -p:Version='${{ steps.version.outputs.value }}' `
            -p:ContinuousIntegrationBuild=true

      - name: Pack
        shell: pwsh
        run: |
          dotnet pack Unosquare.FFME.Avalonia/Unosquare.FFME.Avalonia.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --output Publish `
            -p:PackageVersion='${{ steps.version.outputs.value }}' `
            -p:RepositoryBranch='${{ github.ref_name }}' `
            -p:RepositoryCommit='${{ github.sha }}' `
            -p:ContinuousIntegrationBuild=true

      - name: Upload Avalonia package
        uses: actions/upload-artifact@v4
        with:
          name: FFME.Avalonia-${{ github.sha }}
          path: Publish/*
          if-no-files-found: error

      - name: Log in to NuGet with OIDC
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: lijiaolong

      - name: Publish Avalonia package to NuGet
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'Publish/FFME.Avalonia.*.nupkg' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Avalonia package, but found $($packages.Count)."
          }

          $packages | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' `
              --source 'https://api.nuget.org/v3/index.json' `
              --skip-duplicate
          }
