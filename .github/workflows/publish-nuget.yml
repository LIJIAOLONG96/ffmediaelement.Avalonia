name: Publish NuGet package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 1.0.0-beta.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve package version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${MANUAL_VERSION:-$RELEASE_TAG}"
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "Unable to determine the package version." >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Unosquare.FFME.Avalonia/Unosquare.FFME.Avalonia.csproj

      - name: Pack
        run: >-
          dotnet pack Unosquare.FFME.Avalonia/Unosquare.FFME.Avalonia.csproj
          --configuration Release
          --no-restore
          --output artifacts/packages
          -p:PackageVersion=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFME.Avalonia-${{ steps.version.outputs.value }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: lijiaolong

      - name: Push to NuGet.org
        shell: bash
        run: >-
          dotnet nuget push artifacts/packages/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://www.nuget.org/api/v2/package
          --skip-duplicate
